name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the README claims, because the MCP SDK publishes no
        # builds below it. Testing the floor and the current release is what
        # makes that claim worth stating.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Runs the same script the README tells a reader to run, rather than a
      # CI-only invocation. There is no virtualenv here, so this also covers
      # the interpreter fallback in run_all_tests.sh.
      - name: Test suite, stdout proofs and streaming benchmark
        run: ./run_all_tests.sh
